<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b101a">
  <title>LibreTV · 当前离线</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b101a; color: #f4f6fa; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); text-align: center; }
    img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 18px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #aeb8c7; line-height: 1.7; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #2563eb; color: white; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>目前没有网络连接</h1>
    <p>LibreTV 已保留部分应用外壳资源，但影视搜索、直播和在线播放需要网络。恢复网络后即可继续使用。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
