services:
  - type: web
    name: libretv-mobile-zj2917928447
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: PASSWORD
        generateValue: true
      - key: PROXY_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LIVE_ALLOW_PRIVATE
        value: "0"
      - key: DEFAULT_SUBSCRIPTIONS
        value: '[{"url":"https://libretv-mobile-zj2917928447.onrender.com/open-media-sources.json","name":"开放影视资料库（Internet Archive / NASA / PeerTube / Wikimedia Commons）","refreshDays":1}]'
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
